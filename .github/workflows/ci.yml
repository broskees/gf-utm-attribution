name: CI

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  test:
    # Both jobs pin ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, where preinstalled php and zip are not guaranteed.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Lint PHP
        run: php -l plugin/plugin.php

      - name: Unit tests
        run: node tests/capture.test.js

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build zip
        run: bin/build-release.sh "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/gf-utm-attribution.zip --verify-tag --title "GF UTM Attribution $GITHUB_REF_NAME" --generate-notes
