name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint PHP
        run: php -l plugin/plugin.php

      - name: Unit tests
        run: node tests/capture.test.js

      - name: Build zip
        run: bin/build-release.sh "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/gf-utm-attribution.zip --verify-tag --title "GF UTM Attribution $GITHUB_REF_NAME" --generate-notes
